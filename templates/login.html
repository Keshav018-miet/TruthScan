{% extends 'base.html' %}

{% block content %}
<div style="max-width: 450px; margin: 2rem auto;">
    <div class="card" style="padding: 2rem; border-top: 4px solid var(--accent);">
        <h2 style="text-align: center; margin-bottom: 0.5rem;">🔑 TruthScan Login</h2>
        <p class="card-desc" style="text-align: center; margin-bottom: 1.5rem;">Access secure digital content verification & forensic tools.</p>
        
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
            </div>
            
            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Sign In</button>
        </form>
        
        <div style="margin-top: 1.5rem; padding: 0.75rem; background: rgba(255, 255, 255, 0.03); border-radius: 4px; border: 1px dashed var(--border-color); font-size: 0.85rem;">
            <strong>⚡ Quick Demo Credentials:</strong><br>
            • Username: <code style="color: var(--accent);">admin</code><br>
            • Password: <code style="color: var(--accent);">admin123</code>
        </div>
        
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--accent); font-weight: bold;">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
